<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌤️ Weather Dashboard</h1>
            <p class="subtitle">Real-time weather information</p>
        </header>

        <div class="search-container">
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Enter city name..."
                    autocomplete="off"
                >
                <button id="searchBtn" class="search-btn">
                    <i class="fas fa-search"></i> Search
                </button>
            </div>
            <button id="locationBtn" class="location-btn" title="Use my location">
                <i class="fas fa-map-marker-alt"></i>
            </button>
        </div>

        <div id="loadingSpinner" class="spinner hidden"></div>

        <div id="errorMessage" class="error-message hidden"></div>

        <!-- Current Weather Section -->
        <div id="currentWeather" class="current-weather hidden">
            <div class="weather-header">
                <div class="location-info">
                    <h2 id="cityName"></h2>
                    <p id="date"></p>
                </div>
                <div class="weather-icon">
                    <img id="weatherIcon" src="" alt="Weather icon">
                </div>
            </div>

            <div class="temperature-section">
                <div class="main-temp">
                    <span id="temperature" class="temp"></span>
                    <span class="unit">°C</span>
                </div>
                <p id="weatherDescription" class="description"></p>
            </div>

            <div class="weather-details">
                <div class="detail-card">
                    <i class="fas fa-tint"></i>
                    <div>
                        <p class="label">Humidity</p>
                        <p id="humidity" class="value"></p>
                    </div>
                </div>

                <div class="detail-card">
                    <i class="fas fa-wind"></i>
                    <div>
                        <p class="label">Wind Speed</p>
                        <p id="windSpeed" class="value"></p>
                    </div>
                </div>

                <div class="detail-card">
                    <i class="fas fa-eye"></i>
                    <div>
                        <p class="label">Visibility</p>
                        <p id="visibility" class="value"></p>
                    </div>
                </div>

                <div class="detail-card">
                    <i class="fas fa-compress"></i>
                    <div>
                        <p class="label">Pressure</p>
                        <p id="pressure" class="value"></p>
                    </div>
                </div>

                <div class="detail-card">
                    <i class="fas fa-thermometer-half"></i>
                    <div>
                        <p class="label">Feels Like</p>
                        <p id="feelsLike" class="value"></p>
                    </div>
                </div>

                <div class="detail-card">
                    <i class="fas fa-sun"></i>
                    <div>
                        <p class="label">UV Index</p>
                        <p id="uvIndex" class="value"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 5-Day Forecast Section -->
        <div id="forecastSection" class="forecast-section hidden">
            <h3>5-Day Forecast</h3>
            <div id="forecastContainer" class="forecast-container"></div>
        </div>

        <!-- Favorites Section -->
        <div class="favorites-section">
            <h3>Favorite Cities</h3>
            <div id="favoritesList" class="favorites-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
